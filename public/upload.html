<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Upload</title>
<link rel="stylesheet" href="/assets/upload.css">
</head>
<body class="centered"
      data-sid="{{SID}}"
      data-expires-at="{{EXPIRES_AT}}"
      data-max-bytes="{{MAX_FILE_BYTES}}">
<main class="card">
  <header>
    <h1>Upload</h1>
    <p class="muted">Images and videos. Link expires in <span id="countdown">--:--</span>.</p>
  </header>

  <label id="drop" class="drop" for="picker" tabindex="0">
    <span class="drop-title">Drop a file here</span>
    <span class="muted">or click to choose</span>
    <input id="picker" type="file" accept="image/png,image/jpeg,image/gif,image/webp,image/avif,video/mp4,video/webm,video/quicktime" hidden>
  </label>

  <section id="preview" class="preview" hidden>
    <div id="preview-slot"></div>
    <p id="filename" class="muted"></p>
  </section>

  <div id="progress-wrap" class="progress" hidden>
    <div id="progress-bar" class="progress-bar"></div>
  </div>

  <p id="status" class="status" role="status"></p>

  <button id="send" class="button" type="button" disabled>Upload</button>
</main>
<script src="/assets/upload.js"></script>
</body>
</html>
