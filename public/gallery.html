<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Your uploads</title>
    <link rel="icon" href="/assets/mascot-small.png" type="image/png" />
    <link rel="stylesheet" href="/assets/upload.css" />
  </head>
  <body data-token="{{TOKEN}}">
    <header class="bar">
      <img
        class="mark"
        src="/assets/mascot-small.png"
        alt=""
        width="48"
        height="48"
      />
      <div class="bar-title">
        <span class="bar-name">Your uploads</span>
        <span class="bar-sub">{{SUMMARY}}</span>
      </div>
      <div class="bar-end"><span class="count">{{COUNT}}</span></div>
    </header>
    {{TILES}}
    <script type="module" src="/assets/gallery.js"></script>
  </body>
</html>
